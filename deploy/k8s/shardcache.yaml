# ShardCache on Kubernetes: a StatefulSet gives each pod a stable name and
# DNS entry (shardcache-0.shardcache-headless...), which becomes its node ID
# and advertised address. Pods join by gossip through shardcache-0, and on
# scale-down SIGTERM makes a pod leave gracefully, handing its data to the
# remaining pods before it exits.
#
#   kubectl apply -f deploy/k8s/shardcache.yaml
#   kubectl run -it --rm redis --image=redis:7 -- redis-cli -h shardcache SET k v
#   kubectl scale statefulset shardcache --replicas=5
---
apiVersion: v1
kind: Service
metadata:
  name: shardcache-headless
  labels: {app: shardcache}
spec:
  clusterIP: None
  # Peers must resolve each other before they are ready, or the first pod
  # could never be found by the others.
  publishNotReadyAddresses: true
  selector: {app: shardcache}
  ports:
    - {name: resp, port: 7001}
    - {name: metrics, port: 9001}
---
apiVersion: v1
kind: Service
metadata:
  name: shardcache
  labels: {app: shardcache}
spec:
  # Clients may talk to any pod: every node coordinates any key.
  selector: {app: shardcache}
  ports:
    - {name: resp, port: 6379, targetPort: 7001}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shardcache
spec:
  # With N=3, R=W=2, losing more than one replica at a time loses quorum.
  maxUnavailable: 1
  selector:
    matchLabels: {app: shardcache}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shardcache
  labels: {app: shardcache}
spec:
  serviceName: shardcache-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: shardcache}
  template:
    metadata:
      labels: {app: shardcache}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9001"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: shardcache}
      containers:
        - name: shardcache
          image: shardcache:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: resp, containerPort: 7001}
            - {name: metrics, containerPort: 9001}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: NODE_ID
              value: $(POD_NAME)
            - name: ADVERTISE_HOST
              value: $(POD_NAME).shardcache-headless.$(POD_NAMESPACE).svc.cluster.local
            - name: SEEDS
              value: shardcache-0.shardcache-headless.$(POD_NAMESPACE).svc.cluster.local:7001
            - {name: REPLICATION_FACTOR, value: "3"}
            - {name: CONSISTENCY, value: quorum}
            - {name: CACHE_CAPACITY, value: "1000000"}
            - {name: SNAPSHOT_PATH, value: /data/shardcache.snap}
            - {name: SNAPSHOT_INTERVAL_SEC, value: "30"}
            - {name: LOG_LEVEL, value: info}
          readinessProbe:
            httpGet: {path: /health, port: metrics}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
