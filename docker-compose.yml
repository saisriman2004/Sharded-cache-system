# Three-node ShardCache cluster with Prometheus and Grafana.
#   docker compose up --build
#   redis-cli -p 7001 SET hello world && redis-cli -p 7003 GET hello
#   Grafana: http://localhost:3000 (dashboard "ShardCache")  Prometheus: http://localhost:9090
# Nodes find each other by gossip: node-a starts alone, b and c join through it.

x-node: &node
  build: .
  image: shardcache:latest
  restart: unless-stopped
  stop_grace_period: 20s   # time for a graceful leave (data handoff)

services:
  node-a:
    <<: *node
    hostname: node-a
    ports: ["7001:7001"]
    environment:
      NODE_ID: node-a
      ADVERTISE_HOST: node-a
    volumes: ["data-a:/data"]

  node-b:
    <<: *node
    hostname: node-b
    ports: ["7002:7001"]
    environment:
      NODE_ID: node-b
      ADVERTISE_HOST: node-b
      SEEDS: node-a:7001
    volumes: ["data-b:/data"]
    depends_on: [node-a]

  node-c:
    <<: *node
    hostname: node-c
    ports: ["7003:7001"]
    environment:
      NODE_ID: node-c
      ADVERTISE_HOST: node-c
      SEEDS: node-a:7001
    volumes: ["data-c:/data"]
    depends_on: [node-a]

  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [node-a, node-b, node-c]

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shardcache.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  data-a:
  data-b:
  data-c:
